# 简体中文版自动化维护工作流
#
# 适用于把 zh-CN 分支推送到自己的 GitHub fork 之后。
# - 手动触发: Actions 页面 Run workflow，可填版本号（留空自动跟随上游）
# - 定时触发: 每晚零点（北京时间，UTC 16:00）自动构建（注释掉 schedule 即可关闭）
# - 无变化跳过: zh-CN 与已发布版本一致（上游、本地均无新提交）时，
#   自动跳过构建与发布，不重复发版
#
# 流程: merge(合并上游 + 解析版本号) → build(macos/ubuntu/windows 三平台矩阵，
# 各平台未签名出包) → release(汇总产物，发布 GitHub Release v<上游版本号>)
#
# 产物与官方 release 对齐: mac dmg/zip、linux AppImage/deb/rpm、win nsis exe，
# 均含 x64 + arm64。差异仅两点——本机无签名证书故全部未签名，且不含官方
# 的 mac pkg（pkg 无法像 dmg 一样右键绕过 Gatekeeper，未签名无意义）。
# 审计结果作为 i18n-audit artifact 上传；若不为空说明有新文案待补翻。

name: zh-CN build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空自动取上游最新 release tag）'
        required: false
        default: ''
  schedule:
    # 每晚零点（北京时间，即 UTC 16:00）
    - cron: '0 16 * * *'

concurrency:
  group: zh-cn-build
  cancel-in-progress: false

jobs:
  merge:
    name: Merge upstream & resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - name: Checkout zh-CN branch
        uses: actions/checkout@v4
        with:
          ref: zh-CN
          fetch-depth: 0

      - name: Fetch upstream and merge origin/main into zh-CN
        run: |
          git config user.name "zh-CN bot"
          git config user.email "bot@users.noreply.github.com"
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "已是最新，无需合并。"
          elif git merge --no-edit origin/main; then
            git push origin zh-CN
          else
            echo "以下文件存在冲突，请在本地按 docs/zh-maintenance.md 解决后重推:"
            git diff --name-only --diff-filter=U
            exit 2
          fi

      - name: Resolve version
        id: resolve
        run: |
          git fetch origin --tags --quiet
          MANUAL="${{ github.event.inputs.version }}"
          if [ -z "$MANUAL" ]; then
            # 上游 main 的 package.json 长期不随发布更新（停在旧大版本），
            # 真实版本以官方最新 release tag 为准
            VERSION=$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
            echo "跟随上游最新 release: $VERSION"
          else
            VERSION="$MANUAL"
            echo "使用手动指定版本: $VERSION"
          fi

          # 无变化跳过：非手动指定版本、且 zh-CN 当前提交与该版本 tag 指向的
          # 提交一致时，说明上游和本地都没有新改动，跳过构建与发布。
          # （本地推送翻译修正后 HEAD 前移，下个周期会自动重新打包发布）
          CHANGED=true
          if [ -z "$MANUAL" ]; then
            TAG_COMMIT=$(git rev-parse -q --verify "v${VERSION}^{commit}" 2>/dev/null || true)
            if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" = "$(git rev-parse HEAD)" ]; then
              CHANGED=false
              echo "zh-CN 与 v${VERSION} 发布时完全一致，跳过构建与发布"
            fi
          fi
          {
            echo "version=$VERSION"
            echo "changed=$CHANGED"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: merge
    if: needs.merge.outputs.changed == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            audit: true
          - os: ubuntu-latest
            platform: linux
            audit: false
          - os: windows-latest
            platform: win
            audit: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout zh-CN branch
        uses: actions/checkout@v4
        with:
          ref: zh-CN
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, audit, build web app and package
        shell: bash
        run: ./scripts-dev/update-zh.sh "${{ needs.merge.outputs.version }}"

      - name: Collect localization audit results
        if: matrix.audit
        run: |
          mkdir -p i18n-audit
          cp /tmp/i18n_hardcoded.txt /tmp/i18n_missing.json i18n-audit/ || true

      - name: Upload localization audit results
        if: matrix.audit
        uses: actions/upload-artifact@v4
        with:
          name: i18n-audit
          path: i18n-audit/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            packages/bruno-electron/out/*.dmg
            packages/bruno-electron/out/*.zip
            packages/bruno-electron/out/*.exe
            packages/bruno-electron/out/*.AppImage
            packages/bruno-electron/out/*.deb
            packages/bruno-electron/out/*.rpm

  release:
    name: Publish GitHub Release
    needs: [merge, build]
    if: needs.merge.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # release job 不 checkout 仓库，用 GH_REPO 告诉 gh 操作哪个仓库
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.merge.outputs.version }}"
          TAG="v${VERSION}"
          ls -lh dist
          # 重跑同版本号时先清掉旧 release/tag，保证资产始终对应最新构建
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --target zh-CN \
            --title "Bruno v${VERSION} 简体中文版" \
            --notes "对官方版本 v${VERSION} 进行汉化处理。"
